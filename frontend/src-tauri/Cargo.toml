[package]
name = "hephaestus-desktop"
version = "0.1.0"
description = "Hephaestus desktop shell (Tauri) — bundles the FastAPI backend + UI"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "hephaestus-desktop"
path = "src/main.rs"
